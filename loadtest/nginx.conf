# Load balancer for the load test: several `next start` processes behind one port, the way Vercel
# runs many function instances behind its edge. least_conn sends each request to the least busy one.
worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx-lt.pid;
error_log /tmp/nginx-lt-error.log warn;
events { worker_connections 16384; multi_accept on; }
http {
  access_log off;
  # Stand-in for Vercel's CDN: caches exactly what the app marks cacheable (ISR pages, the 2-second
  # seat map), one upstream fetch per expiry (proxy_cache_lock), stale served while refreshing.
  proxy_cache_path /tmp/nginx-lt-cache keys_zone=edge:20m max_size=200m inactive=10m;
  upstream app { least_conn; server 127.0.0.1:3001; server 127.0.0.1:3002; server 127.0.0.1:3003; keepalive 256; }
  server {
    listen 3000;
    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_read_timeout 120s;
      proxy_cache edge;
      proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout;
      proxy_cache_background_update on;
      add_header X-Edge-Cache $upstream_cache_status always;
    }
  }
}

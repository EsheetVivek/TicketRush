name: Reconcile payments
# Free scheduler for the reconciler (Vercel Hobby crons only run daily).
# Needs repo secrets APP_URL (e.g. https://ticketrush.vercel.app) and CRON_SECRET (same value as in Vercel).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call reconciler
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets not set yet, skipping."; exit 0; fi
          url="${APP_URL%/}/api/cron/reconcile"
          code=$(curl -sS --max-time 90 -o body.json -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$url")
          echo "HTTP $code"; cat body.json; echo
          # A redirect (e.g. to Vercel's login page) or any non-200 is a failure, not a silent success.
          [ "$code" = "200" ] || { echo "::error::Reconciler returned HTTP $code. Check APP_URL is the production domain and CRON_SECRET matches Vercel."; exit 1; }

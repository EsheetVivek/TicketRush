name: Reconcile payments
# Free scheduler for the reconciler (Vercel Hobby crons only run daily).
# Needs repo secrets APP_URL (e.g. https://ticketrush.vercel.app) and CRON_SECRET (same value as in Vercel).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call reconciler
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets not set yet, skipping."; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reconcile"
